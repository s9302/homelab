#Prometheus + Grafana for the cluster. Tailnet-only.
arch: amd64
cores: 2
features: nesting=1,keyctl=1
hostname: monitor
memory: 2048
net0: name=eth0,bridge=vmbr0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,ip6=auto,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: pve2-ssd:subvol-203-disk-0,size=20G
swap: 512
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
