#Langfuse%3A LLM session tracing. /opt/langfuse
arch: amd64
cores: 4
dev0: path=/dev/net/tun
features: nesting=1,keyctl=1
hostname: langfuse
memory: 8192
net0: name=eth0,bridge=vmbr0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-204-disk-0,size=60G
swap: 2048
unprivileged: 1
