name: llm-router
net0: virtio=xx:xx:xx:xx:xx:xx,bridge=vmbr0,trunks=4000
net1: virtio=xx:xx:xx:xx:xx:xx,bridge=llm
onboot: 1
ostype: l26
scsi0: pve2-ssd:vm-410-disk-0,size=8G
scsihw: virtio-scsi-single
serial0: socket
smbios1: uuid=ebc417b9-898c-4b7d-a265-c2df44dcb32b
vga: serial0
vmgenid: e4c0dcb3-c26a-48cc-bdb4-2b4842d66f70
