arch: amd64
cores: 1
features: nesting=1
hostname: pihole
memory: 1024
net0: name=eth0,bridge=vmbr0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-200-disk-0,size=4G
swap: 512
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
