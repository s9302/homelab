#Secret Santa app (santa.spencersmith.win) via Cloudflare Tunnel. Managed with pct exec, no SSH/Tailscale.
arch: amd64
cores: 1
features: nesting=1
hostname: santa
memory: 512
nameserver: 1.1.1.1 8.8.8.8
net0: name=eth0,bridge=vmbr0,firewall=0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-107-disk-0,size=4G
swap: 256
timezone: America/Denver
unprivileged: 1
