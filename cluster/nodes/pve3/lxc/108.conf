#Calendar + to-do app (cal.spencersmith.win) via Cloudflare Tunnel. Managed with pct exec, no SSH/Tailscale.
arch: amd64
cores: 1
features: nesting=1
hostname: cal
memory: 1024
nameserver: 1.1.1.1 8.8.8.8
net0: name=eth0,bridge=vmbr0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-108-disk-0,size=6G
swap: 256
timezone: America/Denver
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
