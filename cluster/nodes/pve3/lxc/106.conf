#RomM game library (docker compose in /opt/romm). Setup log%3A claude-agent ~/romm/SETUP_LOG.md
arch: amd64
cores: 2
dev0: /dev/net/tun
features: nesting=1,keyctl=1
hostname: romm
memory: 4096
mp0: local-lvm:vm-106-disk-1,mp=/library,backup=1,size=58G
net0: name=eth0,bridge=vmbr0,firewall=0,hwaddr=xx:xx:xx:xx:xx:xx,ip=dhcp,ip6=auto,trunks=4000,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-106-disk-0,size=16G
swap: 512
timezone: America/Denver
unprivileged: 1
