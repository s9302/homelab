webhook: discord
	body eyJ1c2VybmFtZSI6ICJQcm94bW94IiwgImNvbnRlbnQiOiB7eyBqc29uIHRpdGxlIH19IH0=
	comment Discord (same channel as Uptime Kuma)
	header name=Content-Type,value=YXBwbGljYXRpb24vanNvbg==
	method post
	url https://discord.com/api/webhooks/{{ secrets.path }}

sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route all notifications to mail-to-root
	mode all
	target mail-to-root

matcher: discord-errors
	comment Backup failures and other errors to Discord
	match-severity error,warning
	mode all
	target discord
