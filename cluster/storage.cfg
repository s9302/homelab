dir: local
	path /var/lib/vz
	content vztmpl,import,iso,backup

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

zfspool: Storage_1
	pool Storage_1
	content rootdir,images
	mountpoint /Storage_1
	nodes proxmox

zfspool: Storage_2
	pool Storage_2
	content rootdir,images
	mountpoint /Storage_2
	nodes proxmox

dir: backups
	path /Storage_2/backups
	content backup
	nodes proxmox
	prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3

zfspool: pve2-ssd
	pool pve2-ssd
	content images,rootdir
	mountpoint /pve2-ssd
	nodes pve2

nfs: backup-on-pve2
	export /mnt/cluster-backups
	path /mnt/pve/backup-on-pve2
	server 10.10.10.2
	content backup
	nodes pve3,proxmox
	options vers=4.2
	prune-backups keep-daily=3,keep-weekly=2

nfs: backup-on-proxmox
	export /Storage_2/cluster-backups
	path /mnt/pve/backup-on-proxmox
	server 10.10.10.1
	content backup
	nodes pve3,pve2
	options vers=4.2
	prune-backups keep-daily=7,keep-weekly=4

