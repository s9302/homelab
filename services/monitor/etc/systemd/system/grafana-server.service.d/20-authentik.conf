# Authentik SSO (2026-11-13). Secret lives in /etc/grafana/oidc.env (root 600).
[Service]
EnvironmentFile=/etc/grafana/oidc.env
Environment=GF_AUTH_GENERIC_OAUTH_ENABLED=true
Environment=GF_AUTH_GENERIC_OAUTH_NAME=Authentik
Environment=GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
Environment="GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email"
Environment=GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.tailnet-name.ts.net/application/o/authorize/
Environment=GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.tailnet-name.ts.net/application/o/token/
Environment=GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.tailnet-name.ts.net/application/o/userinfo/
Environment=GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.tailnet-name.ts.net/application/o/grafana/end-session/
Environment=GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
Environment=GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
Environment=GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
Environment="GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], \x27authentik Admins\x27) && \x27Admin\x27 || \x27Viewer\x27"
