global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Hardware/OS metrics from each Proxmox node (plus this container).
  - job_name: node
    static_configs:
      - targets: ['proxmox:9100', 'pve2:9100', 'pve3:9100']
      - targets: ['127.0.0.1:9100']
        labels: {instance: 'monitor:9100'}

  # Cluster, node and guest metrics from the Proxmox API (read-only token).
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['proxmox']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9221
