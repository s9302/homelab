# Based on rommapp/romm examples/docker-compose.example.yml (master, fetched 2026-10-15, RomM 5.4.0).
# Changes from upstream: secrets come from .env, named volumes replaced with
# bind mounts under /opt/romm, library bind-mounted from the LXC's /library.
services:
  romm:
    image: rommapp/romm:5
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm # Should match MARIADB_DATABASE in mariadb
      - DB_USER=romm-user # Should match MARIADB_USER in mariadb
      - DB_PASSWD=${DB_PASSWD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      # Metadata providers: left blank on purpose. Fill these in /opt/romm/.env, then `docker compose up -d`.
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER:-}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASSWORD:-}
      - RETROACHIEVEMENTS_API_KEY=${RETROACHIEVEMENTS_API_KEY:-}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
      - HASHEOUS_API_ENABLED=true # https://docs.romm.app/latest/Getting-Started/Metadata-Providers/#hasheous
      - SCAN_WORKERS=2 # 2 CPU cores in this LXC
      - WEB_SERVER_CONCURRENCY=2
      - ENABLE_RESCAN_ON_FILESYSTEM_CHANGE=true # auto-scan files rsynced into /library (5 min debounce)
      - RESCAN_ON_FILESYSTEM_CHANGE_DELAY=5
      - ENABLE_SCHEDULED_RESCAN=true # nightly Quick scan as a safety net
      - SCHEDULED_RESCAN_CRON=0 3 * * *
      - TZ=America/Denver
      # Authentik SSO (2026-11-13). Matches existing users by email; no self-registration.
      - OIDC_ENABLED=true
      - OIDC_PROVIDER=authentik
      - OIDC_CLIENT_ID=romm
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=https://romm.tailnet-name.ts.net/api/oauth/openid
      - OIDC_SERVER_APPLICATION_URL=https://auth.tailnet-name.ts.net/application/o/romm
      - OIDC_ALLOW_REGISTRATION=false
    volumes:
      - /opt/romm/resources:/romm/resources # Covers, screenshots, etc. from metadata providers
      - /opt/romm/redis-data:/redis-data # Cached data for background tasks
      - /library:/romm/library # Game library (Structure A: roms/{platform}, bios/{platform})
      - /opt/romm/assets:/romm/assets # Uploaded saves, states, etc.
      - /opt/romm/config:/romm/config # config.yml
    ports:
      - 127.0.0.1:80:8080
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    image: mariadb:13.0
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm-user
      - MARIADB_PASSWORD=${DB_PASSWD}
      - TZ=America/Denver
    volumes:
      - /opt/romm/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5
