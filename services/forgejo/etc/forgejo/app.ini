APP_NAME = Forgejo
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/forgejo

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
DOMAIN = git.tailnet-name.ts.net
ROOT_URL = https://git.tailnet-name.ts.net/
START_SSH_SERVER = true
SSH_DOMAIN = git.tailnet-name.ts.net
SSH_PORT = 2222
SSH_LISTEN_PORT = 2222
LFS_START_SERVER = true
OFFLINE_MODE = true
APP_DATA_PATH = /var/lib/forgejo/data
LFS_JWT_SECRET = REDACTED

[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/data/forgejo.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = /var/lib/forgejo/data/repositories
DEFAULT_PRIVATE = private
DEFAULT_BRANCH = main

[lfs]
PATH = /var/lib/forgejo/data/lfs

[security]
INSTALL_LOCK = true
SECRET_KEY = REDACTED
INTERNAL_TOKEN = REDACTED
PASSWORD_HASH_ALGO = argon2
MIN_PASSWORD_LENGTH = 12

[oauth2]
JWT_SECRET = REDACTED

[service]
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
ENABLE_NOTIFY_MAIL = false

[oauth2_client]
ENABLE_AUTO_REGISTRATION = true
ACCOUNT_LINKING = auto
USERNAME = nickname
UPDATE_AVATAR = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[session]
PROVIDER = db
COOKIE_SECURE = true
SAME_SITE = lax

[mailer]
ENABLED = false

[actions]
ENABLED = true

[log]
MODE = console
LEVEL = Info
ROOT_PATH = /var/lib/forgejo/log

[cron.update_checker]
ENABLED = false
