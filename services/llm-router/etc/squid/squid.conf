# Only the sandbox, only CONNECT, only port 443, only listed hostnames.
# -n: never reverse-resolve raw IPs, so a PTR record cannot satisfy the allowlist.
acl sandbox src 10.98.0.2/32
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed dstdomain -n "/etc/squid/llm-allowed-hosts"
http_access deny !sandbox
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !allowed
http_access allow sandbox
http_access deny all
http_port 10.98.0.1:3128
cache deny all
cache_mem 8 MB
via off
forwarded_for delete
httpd_suppress_version_string on
dns_nameservers 1.1.1.1 1.0.0.1
pinger_enable off
read_timeout 30 minutes
shutdown_lifetime 3 seconds
